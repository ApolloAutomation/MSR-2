# reusable workflow refs are sha-pinned in this repo; dependabot proposes
# updates when new commits land on the upstream branches.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci): "
    groups:
      github-actions:
        patterns:
          - "*"
